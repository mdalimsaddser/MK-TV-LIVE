<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>LiveKhela - Your Ultimate Sports Destination</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* Palette: Modern Deep Ocean */
            --bg-body: #020610;
            --bg-sidebar: #0a1120;
            --bg-panel: #111a2e;
            --bg-input: #080e1a;
            
            --border: rgba(255,255,255,0.06);
            --border-active: rgba(11,132,255,0.5);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --brand: #0b84ff;
            --brand-hover: #40a0ff;
            --danger: #ef4444;
            --success: #22c55e;
            
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            
            --font-family: 'Inter', sans-serif;
            --transition: all 0.2s ease-in-out;
        }
        
        * { box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            background: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-family); 
            -webkit-font-smoothing: antialiased; 
            display: flex;
            flex-direction: column;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a3b55; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f5575; }

        /* Global Elements */
        a { color: inherit; text-decoration: none; transition: var(--transition); }
        a:hover { color: var(--brand); }
        button { border: none; font: inherit; cursor: pointer; transition: var(--transition); background: none; color: inherit; padding: 0;}

        /* Main App Layout */
        .app-container { 
            display: flex; 
            flex: 1;
            height: calc(100vh - 60px); /* Adjust for footer */
            overflow: hidden;
        }

        /* --- Sidebar (Channels) --- */
        .sidebar { 
            width: 320px; 
            background: var(--bg-sidebar); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column;
            z-index: 10;
        }

        .brand-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo { font-weight: 900; font-size: 22px; color: #fff; text-transform: uppercase; letter-spacing: -1px; }
        .brand-logo span { color: var(--brand); }

        .search-area { padding: 16px; border-bottom: 1px solid var(--border); }
        .search-wrapper { position: relative; }
        .search-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px;}
        .search-input { width: 100%; height: 44px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: #fff; padding: 0 14px 0 40px; font-size: 14px; transition: var(--transition); }
        .search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,132,255,0.15); }

        .channel-list-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 0 4px;}
        .list-title { color: var(--text-muted); text-transform: uppercase; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
        .channel-count { font-size: 12px; color: var(--brand); font-weight: 600; background: rgba(11,132,255,0.1); padding: 2px 8px; border-radius: 10px; }

        /* Channel Card Style */
        .channel-card { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            padding: 12px; 
            background: var(--bg-panel); 
            border: 1px solid transparent; 
            border-radius: var(--radius-sm); 
            text-align: left; 
            width: 100%;
        }
        .channel-card:hover { border-color: #2a3b55; transform: translateY(-1px); background: #16223a; }
        .channel-card.active { border-color: var(--brand); background: rgba(11,132,255,0.05); box-shadow: inset 4px 0 0 var(--brand); }

        .ch-logo-wrapper { width: 50px; height: 44px; flex-shrink: 0; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 4px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .ch-logo-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .ch-info { flex: 1; min-width: 0; }
        .ch-name { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .ch-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .ch-status.live { color: var(--success); }
        .ch-status i { font-size: 8px; }

        /* --- Main Content Area --- */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg-body); 
            overflow-y: auto; 
            padding: 24px;
        }

        /* Scoreboard styled like a TV graphic */
        .scoreboard-v2 {
            background: linear-gradient(135deg, #111a2e 0%, #050b14 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px 30px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-lg);
        }

        .sc-team { display: flex; align-items: center; gap: 15px; }
        .sc-team.team-a { justify-content: flex-end; text-align: right; }
        .sc-team.team-b { justify-content: flex-start; text-align: left; }
        
        .sc-flag { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0;}
        .sc-team-name { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; color: #fff; }
        
        .sc-center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;}
        .sc-live-badge { background: var(--danger); color: #fff; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 6px;}
        .sc-live-badge span { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: pulse 1s infinite alternate; }
        .sc-meta { color: var(--text-muted); font-size: 13px; font-weight: 600; max-width: 200px; line-height: 1.4; }

        /* Player Section */
        .player-section { 
            background: var(--bg-panel); 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
        #liveVideo { width: 100%; height: 100%; object-fit: contain; }

        /* Modernized Control Bar */
        .player-control-bar { 
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 20px;
            border-top: 1px solid var(--border);
        }

        .current-channel-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;}
        .mini-logo { width: 40px; height: 34px; background: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; padding: 3px; flex-shrink: 0;}
        .mini-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .mini-logo i { color: #1a2e50; font-size: 16px; }
        .current-ch-name { font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-btns { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .p-btn { 
            height: 42px; 
            padding: 0 18px; 
            border-radius: var(--radius-sm); 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            background: #1c2a46;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .p-btn:hover { background: #2a3b55; border-color: rgba(255,255,255,0.1); }
        .p-btn.primary { background: var(--brand); border-color: var(--brand); }
        .p-btn.primary:hover { background: var(--brand-hover); }
        .p-btn i { font-size: 14px; }

        /* Premium Footer Styling */
        .app-footer {
            height: 60px;
            background: #060d1a;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .app-footer span { color: #fff; font-weight: 700; margin-left: 5px;}
        .app-footer i { color: var(--danger); margin: 0 4px; animation: pulse 0.6s infinite alternate; }
        .dev-badge { background: rgba(11,132,255,0.1); color: var(--brand); padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-left: 10px; text-transform: uppercase; border: 1px solid rgba(11,132,255,0.2); }

        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Tablet Layout */
        @media (max-width: 1200px) {
            .sidebar { width: 280px; }
            .sc-team-name { font-size: 18px; }
            .sc-flag { width: 40px; height: 40px; }
        }

        /* Mobile Layout Stack */
        @media (max-width: 900px) {
            .app-container { flex-direction: column; height: auto; overflow: visible; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); position: relative; }
            .channel-list-container { height: 300px; }
            .main-content { padding: 15px; overflow: visible; }
            .scoreboard-v2 { padding: 15px; gap: 10px; grid-template-columns: 1fr; text-align: center;}
            .sc-team { justify-content: center !important; text-align: center !important; flex-direction: column; gap: 5px;}
            .sc-center { order: -1; margin-bottom: 10px;}
            
            .player-control-bar { flex-direction: column; gap: 15px; text-align: center; }
            .current-channel-info { justify-content: center; width: 100%;}
            .player-btns { width: 100%; justify-content: center; flex-wrap: wrap;}
            .p-btn { flex: 1; justify-content: center; min-width: 120px; }
            .app-footer { flex-direction: column; height: auto; padding: 15px 10px; gap: 8px; text-align: center; }
            .dev-badge { margin-left: 0; }
        }

        /* Toast UI */
        .toast { position: fixed; bottom: 20px; right: 20px; background: #111a2e; border: 1px solid #2a3b55; color: #fff; padding: 14px 22px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; z-index: 10000; transform: translateY(100px); opacity: 0; transition: var(--transition); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast i { color: var(--danger); }
    </style>
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="brand-header">
            <i class="fa fa-play-circle text-brand fa-2x"></i>
            <div class="brand-logo">Live<span>Khela</span></div>
        </div>
        
        <div class="search-area">
            <div class="search-wrapper">
                <i class="fa fa-search"></i>
                <input type="text" id="channelSearch" class="search-input" placeholder="Search sports channels..." autocomplete="off">
            </div>
        </div>

        <div class="channel-list-container">
            <div class="list-header">
                <div class="list-title">All Channels</div>
                <div class="channel-count" id="channel-count">0</div>
            </div>
            <div id="channelStrip" class="space-y-2">
                </div>
        </div>
    </aside>

    <main class="main-content">

        <header class="scoreboard-v2">
            <div class="sc-team team-a">
                <div class="sc-team-name">Qatar</div>
                <img src="https://flagcdn.com/qa.svg" alt="Qatar" class="sc-flag">
            </div>
            
            <div class="sc-center">
                <div class="sc-live-badge"><span></span>LIVE</div>
                <div class="sc-meta">FIFA World Cup 2026<br>Group Stage • Gr B</div>
            </div>
            
            <div class="sc-team team-b">
                <img src="https://flagcdn.com/ch.svg" alt="Switzerland" class="sc-flag">
                <div class="sc-team-name">Swiss</div>
            </div>
        </header>

        <section class="player-section" id="playerCard">
            <div class="video-container" id="videoContainer">
                <video id="liveVideo" controls playsinline poster="https://images.unsplash.com/photo-1579952367243-d8d144f63553?q=80&w=1200&auto=format&fit=crop"></video>
            </div>
            
            <div class="player-control-bar">
                <div class="current-channel-info">
                    <div class="mini-logo" id="active-logo">
                        <i class="fa fa-tv"></i>
                    </div>
                    <div class="current-ch-name" id="active-name">Select a Channel</div>
                </div>
                
                <div class="player-btns">
                    <button type="button" class="p-btn primary" id="playBtn" onclick="togglePlay()">
                        <i class="fa fa-play"></i> Play
                    </button>
                    <button type="button" class="p-btn" id="muteBtn" onclick="toggleMute()">
                        <i class="fa fa-volume-up"></i> Unmute
                    </button>
                    <button type="button" class="p-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
                        <i class="fa fa-expand"></i> Fullscreen
                    </button>
                </div>
            </div>
        </section>

    </main>
</div>

<footer class="app-footer">
    &copy; 2026 LiveKhela. All Rights Reserved. Crafted with <i class="fa fa-heart"></i> By <span>Md Sabbir Hossain</span>
    <div class="dev-badge">Core Developer</div>
</footer>

<div class="toast" id="toastBox"><i class="fa fa-exclamation-circle"></i> <span id="toastMsg">Notification</span></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<script>
    // Master Channel Database
    window.masterChannels = [
        { id: 'tyc_sports', title: 'TyC Sports HD', type: 'hls', url: 'https://amg26268-amg26268c14-freelivesports-emea-10267.playouts.now.amagi.tv/ts-us-e2-n2/playlist/amg26268-sportsstudio-tycsports-freelivesportsemea/cb573b1c6570608f84c83d64cef045826e371fde1d6988693eb5518975d10725dce2b48be65b9e3608dd4087351a654f5d79cb12ce1f7cdaa973ad54516c6531c3c4e664bb981477d5c11f5b6af3264b36ab5c6e89614c278abe545bd37dfd522d27c52522163e84b60cbd010796db55926f5ad3ef823c6c625b5b96435dfba040a3ef9c02178130f4a17f19c37e07be9d47cad302b886c64fcd118324f51dc896ed8dd414849b9062ff56af350b0f75309fd27b97cc09e38bc9386d9943282c663d67080e9c345eb3740131cdf1c2ab60fb53fd9d24956524c978f22daa11faa62e94c59b238ea2a9cb4a0118a9c1496824a19fc0c09b6775d5ee9cd36a1888d8d97636583e515e5be7d02ca85d817ba5ce1084bf2084fb4a1531c3904294a714e28555ec67933fc3cbf89972170033444aaa54ac8f758069fc76acdc1c28580d1ce3ca1b94dd996d1d2f68dfd50be15339acd28787903c6a9c4e2c13a841c94b0969fb316e57ec39b6cf6f3bc7755cc57d16d36c18ac0ebcb425fea29bc20338bed18e02dc67fdba07d7b953fd3472094ce3bc7c1f68437fd9e2634d0378c544f6da85b4245e4ebfa1bf8eaa3419093d055d058f908228d5de8e79675cab3415617903029803a40eec0144133bc719a9c43a59c8217878b3927d31776394c1bd84c7e6c24bbb7ad9acac6a7cdb38d54de5b44056244e35e922322778b371ab64d534d4/133/1920x1080_5162480/index.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/commons/d/da/TyC_Sports_logo_2022.png' },
        { id: 'sports_legends', title: 'Sports Legends', type: 'hls', url: 'https://nomawnoijl.gpcdn.net/akash/sportslegends/chunks.m3u8', logo: 'https://ui-avatars.com/api/?name=SL&background=e50914&color=fff' }
    ];

    let currentActiveId = null;
    let hlsInstance = null;
    let dashInstance = null;
    const video = document.getElementById('liveVideo');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');

    function renderChannels(filterText = '') {
        const strip = document.getElementById('channelStrip');
        strip.innerHTML = '';
        
        let visibleCount = 0;
        window.masterChannels.forEach((ch) => {
            if (filterText && !ch.title.toLowerCase().includes(filterText.toLowerCase())) return;
            
            const isActive = ch.id === currentActiveId;
            const card = document.createElement('button');
            card.className = `channel-card ${isActive ? 'active' : ''}`;
            card.onclick = () => playStream(ch);
            
            const viewers = (Math.random() * 10 + 1).toFixed(1);

            card.innerHTML = `
                <div class="ch-logo-wrapper"><img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/50x44?text=TV'"></div>
                <div class="ch-info">
                    <div class="ch-name">${ch.title}</div>
                    <div class="ch-status live"><i class="fa fa-circle"></i> LIVE • ${viewers}K watching</div>
                </div>
                ${isActive ? '<i class="fa fa-volume-up text-brand"></i>' : ''}
            `;
            strip.appendChild(card);
            visibleCount++;
        });
        
        document.getElementById('channel-count').textContent = visibleCount;
    }

    document.getElementById('channelSearch').addEventListener('input', (e) => {
        renderChannels(e.target.value);
    });

    function playStream(channel) {
        if (currentActiveId === channel.id) return;

        currentActiveId = channel.id;
        renderChannels(document.getElementById('channelSearch').value);
        
        document.getElementById('active-logo').innerHTML = `<img src="${channel.logo}" onerror="this.innerHTML='<i class=fa fa-tv></i>'">`;
        document.getElementById('active-name').textContent = channel.title;

        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        if (dashInstance) { dashInstance.reset(); dashInstance = null; }
        
        video.pause();
        video.removeAttribute('src');
        video.load();

        const isDash = channel.type === 'dash' || channel.url.includes('.dash') || channel.url.includes('.mpd');
        const isHls = channel.type === 'hls' || channel.url.includes('.m3u8');

        try {
            if (isDash && typeof dashjs !== 'undefined') {
                dashInstance = dashjs.MediaPlayer().create();
                dashInstance.initialize(video, channel.url, true);
            } 
            else if (isHls && Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { attemptPlay(); });
            } 
            else {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => { attemptPlay(); }, { once: true });
            }
        } catch (err) {
            showToast("Video format error.");
        }
        updateMediaUI();
    }

    function attemptPlay() {
        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(e => {
                video.muted = true;
                video.play().catch(err => console.log(err));
                updateMediaUI();
            });
        }
    }

    function togglePlay() {
        if (video.paused) { video.play().catch(e => console.warn(e)); } else { video.pause(); }
        updateMediaUI();
    }

    function toggleMute() {
        video.muted = !video.muted;
        updateMediaUI();
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.getElementById('playerCard').requestFullscreen().catch(err => {
                if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            });
        } else {
            document.exitFullscreen();
        }
    }

    function updateMediaUI() {
        playBtn.innerHTML = video.paused ? '<i class="fa fa-play"></i> Play' : '<i class="fa fa-pause"></i> Pause';
        muteBtn.innerHTML = video.muted ? '<i class="fa fa-volume-mute"></i> Muted' : '<i class="fa fa-volume-up"></i> Sound';
        muteBtn.style.opacity = video.muted ? '0.7' : '1';
    }

    video.addEventListener('play', updateMediaUI);
    video.addEventListener('pause', updateMediaUI);
    video.addEventListener('volumechange', updateMediaUI);

    function showToast(msg) {
        const box = document.getElementById('toastBox');
        document.getElementById('toastMsg').textContent = msg;
        box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 3500);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderChannels();
        if(window.masterChannels.length > 0) { playStream(window.masterChannels[0]); }
    });
</script>
</body>
</html>
