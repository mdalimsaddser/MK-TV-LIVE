<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>md sabbir TV</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-sidebar: #222b3d;
            --bg-player: #000000;
            --bg-item: #313d53;
            --bg-item-hover: #3d4a63;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-active: #2ecc71; /* Green glowing border */
            --glow-active: rgba(46, 204, 113, 0.4);
            --num-bg-dark: #1e293b;
            --num-bg-blue: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-player);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Layout --- */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #111;
            z-index: 10;
        }

        .brand {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #60a5fa; 
        }

        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* --- Channel List --- */
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }
        .channel-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .channel-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .channel-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- Channel Item --- */
        .channel-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-item);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            gap: 12px;
        }

        .channel-item:hover {
            background-color: var(--bg-item-hover);
        }

        .channel-item.active {
            border-color: var(--border-active);
            box-shadow: 0 0 12px var(--glow-active);
            background-color: var(--bg-item-hover);
        }

        .ch-num {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 28px;
            text-align: center;
        }

        .num-dark { background-color: var(--num-bg-dark); }
        .num-blue { background-color: var(--num-bg-blue); }

        .ch-logo {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: contain;
            background-color: #fff;
            padding: 2px;
        }

        .ch-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        /* --- Player Area (Advanced Look) --- */
        .player-area {
            flex: 1;
            position: relative;
            background-color: var(--bg-player);
            display: flex;
            align-items: center;
            justify-content: center;
            /* Inner shadow for a cinematic feel */
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.9);
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
            object-fit: contain;
            z-index: 1;
        }

        /* --- Watermarks --- */
        .watermark-live {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            pointer-events: none; /* Prevents blocking video clicks */
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .watermark-brand {
            position: absolute;
            top: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.4); /* Semi-transparent */
            font-size: 24px;
            font-weight: 900;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            user-select: none;
            letter-spacing: 1px;
        }

        /* --- Loader --- */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 5px solid #1f2937;
            border-top: 5px solid #94a3b8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            z-index: 20;
        }

        .loader.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 50vh;
                border-right: none;
                border-top: 1px solid #111;
            }
            .player-area {
                height: 50vh;
                width: 100%;
            }
            .watermark-live {
                top: 15px;
                left: 15px;
                font-size: 11px;
                padding: 4px 10px;
            }
            .watermark-brand {
                top: 15px;
                right: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <img src="https://ui-avatars.com/api/?name=MS&background=1d4ed8&color=fff" alt="md sabbir TV Logo">
            md sabbir TV
        </div>
        <div class="channel-list" id="channelList">
            <!-- Channels will be injected here by Javascript -->
        </div>
    </div>

    <!-- Player Area -->
    <div class="player-area">
        <!-- Live Badge Overlay -->
        <div class="watermark-live">
            <span class="live-dot"></span> Play Live
        </div>
        
        <!-- Brand Watermark Overlay -->
        <div class="watermark-brand">
            sabbir tv 24/7
        </div>

        <video id="videoPlayer" controls autoplay playsinline></video>
        <div class="loader" id="playerLoader"></div>
    </div>

    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <script>
        const channels = [
            { 
                id: 1, 
                name: "Somoy TV", 
                url: "https://live.thebosstv.com:30443/dwlive/Somoy-TV/chunks.m3u8", 
                logo: "https://stream.codecloud.bd/uploads/logos/logo_6a2a3badb5621.png", 
                numClass: "num-dark" 
            },
            { 
                id: 2, 
                name: "TNT Sports", 
                url: "https://1nyaler.streamhostingcdn.top/stream/30/index.m3u8", 
                logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/TNT_Sports_Logo_2023.svg/512px-TNT_Sports_Logo_2023.svg.png", 
                numClass: "num-dark" 
            },
            { 
                id: 3, 
                name: "FIFA Worldcup Bangla", 
                url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeebanglacinema/default/manifest.mpd", 
                logo: "https://stream.codecloud.bd/uploads/logos/logo_96087dbbd66a4f6e.pn", 
                numClass: "num-blue" 
            },
            { 
                id: 4, 
                name: "Fifa Live 2", 
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", 
                logo: "https://upload.wikimedia.org/wikipedia/commons/4/4b/FIFA_WorldCup_logo.svg", 
                numClass: "num-blue" 
            },
            { 
                id: 5, 
                name: "Bein Sports 1", 
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", 
                logo: "https://upload.wikimedia.org/wikipedia/commons/2/20/Bein_sport_logo.png", 
                numClass: "num-blue" 
            },
            { 
                id: 6, 
                name: "TYC Sports", 
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", 
                logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/TyC_Sports_logo.svg/512px-TyC_Sports_logo.svg.png", 
                numClass: "num-blue" 
            },
            { 
                id: 7, 
                name: "TYC Sports", 
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", 
                logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/TyC_Sports_logo.svg/512px-TyC_Sports_logo.svg.png", 
                numClass: "num-blue" 
            },
            { 
                id: 8, 
                name: "Bein Sports 1 4K", 
                url: "https://1nyaler.streamhostingcdn.top/stream/32/index.m3u8", 
                logo: "https://upload.wikimedia.org/wikipedia/commons/2/20/Bein_sport_logo.png", 
                numClass: "num-blue" 
            },
            { 
                id: 9, 
                name: "Premier League", 
                url: "https://premierleagpl23.akamaized.net/hls/live/2107108/tapmad-P2s6L_FiN@L-UrU/level_1.m3u8", 
                logo: "https://upload.wikimedia.org/wikipedia/en/thumb/f/f2/Premier_League_Logo.svg/512px-Premier_League_Logo.svg.png", 
                numClass: "num-dark" 
            }
        ];

        const channelListEl = document.getElementById('channelList');
        const video = document.getElementById('videoPlayer');
        const loader = document.getElementById('playerLoader');
        let hls = null;
        let currentChannelId = null;

        function renderChannels() {
            channelListEl.innerHTML = '';
            
            channels.forEach((channel) => {
                const item = document.createElement('div');
                item.className = `channel-item ${channel.id === currentChannelId ? 'active' : ''}`;
                
                item.onclick = () => playChannel(channel);

                item.innerHTML = `
                    <div class="ch-num ${channel.numClass}">${channel.id}.</div>
                    <img src="${channel.logo}" alt="${channel.name}" class="ch-logo" onerror="this.src='https://placehold.co/32x32/ffffff/000000?text=TV'">
                    <div class="ch-name">${channel.name}</div>
                `;
                
                channelListEl.appendChild(item);
            });
        }

        function playChannel(channel) {
            currentChannelId = channel.id;
            renderChannels(); 
            
            loader.classList.add('active');
            
            if (hls) {
                hls.destroy();
                hls = null;
            }
            
            video.pause();
            video.removeAttribute('src');
            video.load();

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            video.muted = true;
                            video.play().catch(e => console.error("Final play error:", e));
                        });
                    }
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                loader.classList.remove('active');
                                break;
                        }
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(e => {
                        video.muted = true;
                        video.play();
                    });
                });
            }
        }

        video.addEventListener('playing', () => {
            loader.classList.remove('active');
        });

        video.addEventListener('waiting', () => {
            loader.classList.add('active');
        });
        
        video.addEventListener('error', () => {
            loader.classList.remove('active');
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (channels.length > 0) {
                playChannel(channels[0]);
            } else {
                renderChannels();
            }
        });

    </script>
</body>
</html>
