<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR TV - VIP Live TV Deck (Advanced)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent-glow: #ff0055;
            --accent-neon: #8b00ff;
            --bg-dark: #050508;
            --panel-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f5f5fa;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .dashboard-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ambient Blur Background */
        .bg-blur-ambient {
            position: absolute;
            inset: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(50px) brightness(0.35);
            opacity: 0.55;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Content Layout */
        .content-area {
            display: flex;
            flex: 1;
            z-index: 2;
            width: 100%;
            height: calc(100vh - 40px);
        }

        /* Video Section */
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        /* 16:9 Player Container */
        .player-container {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.85);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            outline: none;
            background: transparent;
        }

        /* Advanced Controls Bar */
        .advanced-controls {
            height: 60px;
            background: rgba(5, 5, 8, 0.9);
            border-top: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-action, select {
            background: var(--panel-glass);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-action:hover, select:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-neon);
        }

        select option {
            background: var(--bg-dark);
            color: white;
        }

        .top-overlay-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-glass);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Channel List Sidebar */
        .sidebar {
            width: 350px;
            background: rgba(10, 10, 15, 0.8);
            border-left: 1px solid var(--border-glass);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            z-index: 3;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-glow);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box {
            width: 100%;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 10px 15px 10px 35px;
            border-radius: 5px;
            outline: none;
            transition: border 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-glow);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .channel-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-item:hover, .channel-item.active {
            background: var(--panel-glass);
            border-left: 4px solid var(--accent-glow);
        }

        /* Notice Bar */
        .notice-bar {
            height: 40px;
            background: var(--accent-neon);
            color: #fff;
            display: flex;
            align-items: center;
            font-weight: 600;
            z-index: 5;
            box-shadow: 0 -5px 20px rgba(139, 0, 255, 0.4);
        }

        marquee {
            width: 100%;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Loading Spinner */
        #loader {
            position: absolute;
            color: white;
            font-size: 2rem;
            z-index: 100;
            display: none;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-glow); }
    </style>
</head>

<body>

    <div class="dashboard-wrapper">
        <!-- ওটিটি ব্লার অ্যাম্বিয়েন্ট ব্যাকগ্রাউন্ড -->

                </div>
                <button class="control-action-btn" id="masterFullscreenBtn"><i class="fas fa-expand"></i></button>
            </div>

        </div>

        <!-- নোটিশ বার (এখন ভিডিওর বাইরে এবং অত্যন্ত ছোট) -->

    <script>
        const streamSrc = "https://soft-pond-09f1.lollenses0.workers.dev/https/d1211whpimeups.cloudfront.net/smil:rtbgo/chunklist_b4096000_slENG.m3u8";
        
        const videoElement = document.getElementById('coreVideo');
        const deckContainer = document.getElementById('deckContainer');
        const ambientBg = document.getElementById('ambientBg');
        const centerPlayBtn = document.getElementById('centerPlayBtn');
        const masterMuteBtn = document.getElementById('masterMuteBtn');
        const masterVolSlider = document.getElementById('masterVolSlider');
        const masterFullscreenBtn = document.getElementById('masterFullscreenBtn');
        const bufferMask = document.getElementById('bufferMask');
        const secureWatermark = document.getElementById('secureWatermark');
        const unmuteHint = document.getElementById('unmuteHint');

        const defaultPoster = "https://images.unsplash.com/photo-1540747737956-378724044282?q=80&w=1920";
        videoElement.poster = defaultPoster;
        ambientBg.style.backgroundImage = `url('${defaultPoster}')`;

        let activeEngineInstance = null;

        if (Hls.isSupported()) {
            activeEngineInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
            activeEngineInstance.loadSource(streamSrc);
            activeEngineInstance.attachMedia(videoElement);
            activeEngineInstance.on(Hls.Events.MANIFEST_PARSED, () => { attemptAutoplay(); });
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = streamSrc;
            videoElement.addEventListener('loadedmetadata', attemptAutoplay);
        }

        function attemptAutoplay() {
            videoElement.play().then(() => {
                if(!videoElement.muted) {
                    videoElement.volume = 1;
                    masterVolSlider.value = 1;
                    syncVolumeInterface();
                } else { unmuteHint.style.display = 'block'; }
            }).catch(() => {
                videoElement.muted = true;
                videoElement.play().then(() => { unmuteHint.style.display = 'block'; });
            });
        }

        unmuteHint.addEventListener('click', (e) => {
            e.stopPropagation();
            videoElement.muted = false;
            videoElement.volume = 1;
            masterVolSlider.value = 1;
            syncVolumeInterface();
            unmuteHint.style.display = 'none';
        });

        let activityTimeout;
        function resetActivityTimer() {
            deckContainer.classList.remove('user-inactive');
            deckContainer.classList.add('user-active');
            clearTimeout(activityTimeout);
            activityTimeout = setTimeout(() => {
                if (!videoElement.paused) { 
                    deckContainer.classList.remove('user-active');
                    deckContainer.classList.add('user-inactive');
                }
            }, 3000);
        }
        deckContainer.addEventListener('mousemove', resetActivityTimer);
        deckContainer.addEventListener('touchstart', resetActivityTimer);

        function handlePlayToggle() {
            if (videoElement.paused) {
                videoElement.play().catch(() => {});
            } else {
                videoElement.pause();
                resetActivityTimer();
            }
        }
        centerPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); handlePlayToggle(); });
        videoElement.addEventListener('click', handlePlayToggle);

        videoElement.addEventListener('play', () => centerPlayBtn.innerHTML = '<i class="fas fa-pause"></i>');
        videoElement.addEventListener('pause', () => centerPlayBtn.innerHTML = '<i class="fas fa-play"></i>');

        masterVolSlider.addEventListener('input', (e) => {
            videoElement.volume = e.target.value;
            videoElement.muted = (videoElement.volume === 0);
            syncVolumeInterface();
        });

        masterMuteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            videoElement.muted = !videoElement.muted;
            if(!videoElement.muted && videoElement.volume === 0) videoElement.volume = 0.5;
            syncVolumeInterface();
        });

        function syncVolumeInterface() {
            masterMuteBtn.innerHTML = (videoElement.muted || videoElement.volume === 0) ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            masterVolSlider.value = videoElement.muted ? 0 : videoElement.volume;
        }

        masterFullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) { deckContainer.requestFullscreen().catch(() => {}); } else { document.exitFullscreen(); }
        });

        setInterval(() => {
            secureWatermark.style.left = `${Math.floor(Math.random() * 55) + 20}%`;
            secureWatermark.style.top = `${Math.floor(Math.random() * 40) + 25}%`;
        }, 12000);

        videoElement.addEventListener('waiting', () => bufferMask.classList.add('active'));
        videoElement.addEventListener('playing', () => bufferMask.classList.remove('active'));
    </script>
</body>
</html>
