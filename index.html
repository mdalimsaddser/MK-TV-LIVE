<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md Sabbir Hossain - VIP Live TV Deck</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent-glow: #ff0055; --accent-neon: #8b00ff; --bg-dark: #020204; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .player-container { 
            position: relative; width: 90vw; max-width: 1000px; aspect-ratio: 16/9; 
            background: #000; border-radius: 24px; overflow: hidden; border: 1px solid #333;
        }
        
        video { width: 100%; height: 100%; object-fit: contain; }

        /* HUD Styles */
        .top-overlay-layer { position: absolute; top: 20px; left: 20px; z-index: 10; opacity: 0; transition: 0.3s; }
        .live-status-tag { background: linear-gradient(135deg, var(--accent-glow), var(--accent-neon)); padding: 8px 16px; border-radius: 50px; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        
        .control-hud-panel { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); padding: 15px 25px;
            border-radius: 20px; display: flex; gap: 20px; align-items: center; opacity: 0; transition: 0.3s;
        }

        .player-container:hover .top-overlay-layer, 
        .player-container:hover .control-hud-panel { opacity: 1; }

        .hud-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        
        .tv-news-ticker { position: absolute; bottom: 0; width: 100%; height: 30px; background: #111; display: flex; align-items: center; overflow: hidden; }
        .ticker-text { white-space: nowrap; animation: ticker-move 20s linear infinite; }
        @keyframes ticker-move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

<div class="player-container" id="player-wrap">
    <div class="top-overlay-layer">
        <div class="live-status-tag"><i class="fas fa-circle"></i> LIVE NOW</div>
    </div>

    <video id="video" poster="https://via.placeholder.com/1280x720/000/fff?text=Loading+Stream..."></video>

    <div class="control-hud-panel">
        <button class="hud-btn" id="play-btn"><i class="fas fa-play"></i></button>
        <button class="hud-btn" id="mute-btn"><i class="fas fa-volume-up"></i></button>
        <button class="hud-btn" id="fs-btn"><i class="fas fa-expand"></i></button>
    </div>

    <div class="tv-news-ticker">
        <div class="ticker-text">BREAKING NEWS: Welcome to the VIP Live TV Deck. High-quality streams loading... Stay tuned for more.</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const playBtn = document.getElementById('play-btn');
    const muteBtn = document.getElementById('mute-btn');
    const fsBtn = document.getElementById('fs-btn');
    const playerWrap = document.getElementById('player-wrap');

    // HLS Implementation
    const videoSrc = 'https://1nyaler.streamhostingcdn.top/stream/94/index.m3u8'; 
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
    }

    // Controls
    playBtn.addEventListener('click', () => {
        video.paused ? video.play() : video.pause();
        playBtn.innerHTML = video.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
    });

    muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    });

    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) playerWrap.requestFullscreen();
        else document.exitFullscreen();
    });
</script>

</body>
</html>
