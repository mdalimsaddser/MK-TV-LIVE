    <style>
        :root {
            --bg-sidebar: #222b3d;
            --bg-player: #000000;
            --bg-item: #313d53;
            --bg-item-hover: #3d4a63;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-active: #2ecc71; /* Green glowing border */
            --glow-active: rgba(46, 204, 113, 0.4);
            --num-bg-dark: #1e293b;
            --num-bg-blue: #1d4ed8;
            --bg-category: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-player);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #111;
            z-index: 10;
        }

        .brand {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #60a5fa; 
            flex-shrink: 0;
        }

        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .categories-container {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            overflow-x: auto;
            gap: 8px;
            scrollbar-width: none; /* Firefox */
            flex-shrink: 0;
        }

        .categories-container::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .category-btn {
            background-color: var(--bg-category);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .category-btn:hover {
            color: var(--text-main);
            background-color: var(--bg-item-hover);
        }

        .category-btn.active {
            background-color: var(--border-active);
            color: #000;
            border-color: var(--border-active);
            box-shadow: 0 0 10px var(--glow-active);
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }
        .channel-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .channel-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .channel-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .channel-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-item);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            gap: 12px;
        }

        .channel-item:hover {
            background-color: var(--bg-item-hover);
        }

        .channel-item.active {
            border-color: var(--border-active);
            box-shadow: 0 0 12px var(--glow-active);
            background-color: var(--bg-item-hover);
        }

        .ch-num {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 28px;
            text-align: center;
        }

        .num-dark { background-color: var(--num-bg-dark); }
        .num-blue { background-color: var(--num-bg-blue); }

        .ch-logo {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: contain;
            background-color: #fff;
            padding: 2px;
        }

        .ch-info {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .ch-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ch-category {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-area {
            flex: 1;
            position: relative;
            background-color: var(--bg-player);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.9);
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
            object-fit: contain;
            z-index: 1;
            cursor: pointer;
        }

        .watermark-live {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(220, 38, 38, 0.9);
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .watermark-brand-text {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 24px;
            font-weight: 900;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            /* Dynamic shine effect */
            background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.3) 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.9));
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90px;
            height: 90px;
            background: rgba(46, 204, 113, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.6);
            opacity: 0;
            pointer-events: none;
        }

        .play-overlay.paused {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .play-overlay:hover {
            background: rgba(46, 204, 113, 1);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-overlay svg {
            width: 45px;
            height: 45px;
            fill: #fff;
            margin-left: 6px;
        }

        .error-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9);
            color: #f87171;
            padding: 16px 24px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(248, 113, 113, 0.3);
            display: none;
            z-index: 20;
            backdrop-filter: blur(4px);
            max-width: 80%;
        }

        .error-overlay.active {
            display: block;
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 5px solid #1f2937;
            border-top: 5px solid #94a3b8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            z-index: 20;
        }

        .loader.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 50vh;
                border-right: none;
                border-top: 1px solid #111;
            }
            .player-area {
                height: 50vh;
                width: 100%;
            }
            .watermark-live {
                top: 15px;
                left: 15px;
                font-size: 11px;
                padding: 4px 10px;
            }
            .watermark-brand-text {
                top: 15px;
                right: 15px;
                font-size: 16px;
            }
            .play-overlay {
                width: 60px;
                height: 60px;
            }
            .play-overlay svg {
                width: 30px;
                height: 30px;
            }
        }
    </style>

            { id: 36, name: "Euro TV", category: "Sports", url: "https://stream.ottplus.bd/live/euro_sports_hd_abr/live/euro_sports_hd/chunks.m3u8", logo: "https://imglink.cc/cdn/SZphbKsSMx.png", numClass: "num-dark" },
            { id: 37, name: "Star Jalsha", category: "Entertainment", url: "https://yupptvcatchupire.yuppcdn.net/preview/starjalsha/1800.m3u8", logo: "https://imglink.cc/cdn/3TXPVSGzx5.png", numClass: "num-blue" },
            { id: 38, name: "Star Sports 1 B", category: "Sports", url: "https://tvsen7.aynaott.com/sspts1/index.m3u8", logo: "https://placehold.co/48x48/111827/6b7280?text=TV", numClass: "num-dark" } 
        ];

        const channelListEl = document.getElementById('channelList');
        const categoryContainerEl = document.getElementById('categoryContainer');
        const video = document.getElementById('videoPlayer');
        const loader = document.getElementById('playerLoader');
        const playOverlay = document.getElementById('playOverlay');
        const errorOverlay = document.getElementById('errorOverlay'); // Grab the error element
        
        let hls = null;
        let dashPlayer = null;
        let currentChannelId = null;
        let activeCategory = "All";

        function renderCategories() {
            categoryContainerEl.innerHTML = '';
            
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${category === activeCategory ? 'active' : ''}`;
                btn.textContent = category;
                
                btn.onclick = () => {
                    activeCategory = category;
                    renderCategories(); // Re-render to update active state
                    renderChannels(); // Filter channels
                };
                
                categoryContainerEl.appendChild(btn);
            });
        }

        function renderChannels() {
            channelListEl.innerHTML = '';
            
            // Filter channels based on active category
            const filteredChannels = channels.filter(channel => 
                activeCategory === "All" || channel.category === activeCategory
            );

            if (filteredChannels.length === 0) {
                channelListEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">No channels found in this category.</div>`;
                return;
            }
            
            filteredChannels.forEach((channel) => {
                const item = document.createElement('div');
                item.className = `channel-item ${channel.id === currentChannelId ? 'active' : ''}`;
                
                item.onclick = () => playChannel(channel);

                item.innerHTML = `
                    <div class="ch-num ${channel.numClass}">${channel.id}.</div>
                    <img src="${channel.logo}" alt="${channel.name}" class="ch-logo" onerror="this.src='https://placehold.co/32x32/ffffff/000000?text=TV'">
                    <div class="ch-info">
                        <div class="ch-name">${channel.name}</div>
                        <div class="ch-category">${channel.category}</div>
                    </div>
                `;
                
                channelListEl.appendChild(item);
            });
        }

        function playChannel(channel) {
            currentChannelId = channel.id;
            renderChannels(); // Update active visual state in list
            
            loader.classList.add('active');
            playOverlay.classList.remove('paused');
            errorOverlay.classList.remove('active'); // Hide previous errors
            
            // Clean up previous HLS instance
            if (hls) {
                hls.destroy();
                hls = null;
            }
            
            // Clean up previous DASH instance
            if (dashPlayer) {
                dashPlayer.destroy();
                dashPlayer = null;
            }
            
            video.pause();
            video.removeAttribute('src');
            video.load();

            // Check if the stream is an MPEG-DASH (.mpd) stream
            if (channel.url.includes('.mpd')) {
                dashPlayer = dashjs.MediaPlayer().create();
                
                // Mute dashjs console spam if needed, optional:
                // dashPlayer.updateSettings({ debug: { logLevel: dashjs.Debug.LOG_LEVEL_NONE } });

                dashPlayer.initialize(video, channel.url, true);
                
                dashPlayer.on(dashjs.MediaPlayer.events.PLAYBACK_PLAYING, () => {
                    loader.classList.remove('active');
                    errorOverlay.classList.remove('active');
                });
                
                dashPlayer.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                    console.error("DASH Playback Error:", e);
                    loader.classList.remove('active');
                    playOverlay.classList.remove('paused');
                    
                    // Show user-friendly error if it's a DRM/Manifest issue
                    if (e.error && e.error.message && e.error.message.includes('No streams to play')) {
                        errorOverlay.textContent = "This stream requires DRM decryption keys and cannot be played here.";
                    } else {
                        errorOverlay.textContent = "Stream unavailable or unsupported format.";
                    }
                    errorOverlay.classList.add('active');
                });
            } 
            // Otherwise, treat as HLS (.m3u8) stream
            else if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            // Ignore AbortError caused by quick channel switching
                            if (error.name !== 'AbortError') {
                                video.muted = true;
                                const mutedPlayPromise = video.play();
                                if (mutedPlayPromise !== undefined) {
                                    mutedPlayPromise.catch(e => {
                                        if (e.name !== 'AbortError') {
                                            console.error("Final play error:", e);
                                        }
                                    });
                                }
                            }
                        });
                    }
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                loader.classList.remove('active');
                                playOverlay.classList.remove('paused');
                                errorOverlay.textContent = "Stream connection failed.";
                                errorOverlay.classList.add('active');
                                break;
                        }
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari support fallback
                video.src = channel.url;
                video.onloadedmetadata = function() {
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            if (error.name !== 'AbortError') {
                                video.muted = true;
                                video.play().catch(e => {
                                    if(e.name !== 'AbortError') {
                                         loader.classList.remove('active');
                                         errorOverlay.textContent = "Stream playback failed.";
                                         errorOverlay.classList.add('active');
                                    }
                                });
                            }
                        });
                    }
                };
            }
        }

        video.addEventListener('playing', () => {
            loader.classList.remove('active');
        });

        video.addEventListener('waiting', () => {
            loader.classList.add('active');
        });
        
        video.addEventListener('error', () => {
            loader.classList.remove('active');
        });

        video.addEventListener('pause', () => {
            playOverlay.classList.add('paused');
        });

        video.addEventListener('play', () => {
            playOverlay.classList.remove('paused');
        });

        playOverlay.addEventListener('click', () => {
            video.play();
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Render Initial UI
            renderCategories();
            renderChannels();
            
            // Auto-play the very first channel in the entire database on load
            if (channels.length > 0) {
                playChannel(channels[0]);
            }
        });

    </script>
</body>
</html>
