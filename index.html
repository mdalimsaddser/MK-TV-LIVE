<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>LiveKhela Clone - Sports & Live TV</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #020617; /* Deep cinematic black/blue */
            --panel: rgba(8, 19, 33, 0.7);
            --panel2: #0b1728;
            --panel3: #10223b;
            --line: rgba(148,163,184,.12);
            --text: #f8fafc;
            --muted: #9aacbf;
            --brand: #0b84ff;
            --success: #22c55e;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 18px 48px rgba(0,0,0,.5);
        }
        
        * { box-sizing: border-box; }
        html { background: var(--bg); scroll-behavior: smooth; }
        body { 
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); 
            font-family: 'Nunito', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; 
        }
        
        /* Advanced Breathing Cinematic Background */
        body:before { 
            content: ''; position: fixed; inset: 0; z-index: -1; 
            background: radial-gradient(circle at 15% 20%, rgba(11, 132, 255, 0.15), transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(239, 68, 68, 0.1), transparent 40%), 
                        var(--bg); 
            animation: breathe 8s infinite alternate ease-in-out;
        }
        @keyframes breathe { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }

        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; cursor: pointer; outline: none; border: none; }

        .page { 
            width: 100%; max-width: 1560px; margin: 0 auto; padding: 20px 22px 34px; 
            display: grid; grid-template-columns: minmax(260px,320px) minmax(0,1fr) minmax(260px,320px); 
            grid-template-areas: 'score score score' 'servers player info' 'servers match info' 'servers schedule info' 'footer footer footer'; 
            gap: 16px; align-items: start; 
        }
        
        .mlbd-scoreboard { 
            grid-area: score; margin: 0; min-height: 86px; border-bottom: 2px solid var(--brand); 
            background: linear-gradient(135deg, rgba(35, 36, 40, 0.8), rgba(28, 29, 33, 0.8)); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 16px 28px; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); 
            align-items: center; gap: 18px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.05);
        }
        .score-team { display: flex; align-items: center; gap: 13px; color: #fff; font-size: 24px; font-weight: 1000; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .score-team-right { justify-content: flex-end; text-align: right; }
        .score-team img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,0.1); }
        .score-center { text-align: center; color: #fff; }
        .score-live { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 16px; border-radius: 20px; background: var(--danger); font-size: 13px; font-weight: 1000; text-transform: uppercase; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .score-live span { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1s infinite alternate; box-shadow: 0 0 8px #fff; }
        .score-title { margin-top: 8px; color: #b7bac1; font-size: 13px; font-weight: 1000; text-transform: uppercase; letter-spacing: 1px; }
        
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }

        .player-card { grid-area: player; width: 100%; min-width: 0; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6)); }
        .player-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px 12px 0 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); border-bottom: none; }
        #liveVideo { width: 100%; height: 100%; object-fit: contain; outline: none; }
        .player-bar { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(470px, auto); gap: 10px; align-items: center; padding: 16px; background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 0 0 12px 12px; }
        .now-playing-switch { display: flex; align-items: center; gap: 10px; }
        .bar-channel-picker-btn { width: 100%; height: 50px; border-radius: 8px; border: 1px solid rgba(11,132,255,.3); background: rgba(16, 43, 74, 0.6); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-weight: 1000; text-transform: uppercase; text-align: left; transition: all 0.3s ease; }
        .bar-channel-picker-btn:hover { background: rgba(16, 43, 74, 0.9); border-color: var(--brand); box-shadow: 0 0 15px rgba(11,132,255,0.2); }
        .bar-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .action-btn { height: 46px; padding: 0 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,.05); background: rgba(255,255,255,0.05); color: #fff; font-weight: 900; display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; font-size: 13px; transition: 0.3s ease; backdrop-filter: blur(5px); }
        .action-btn.primary { background: linear-gradient(135deg, #113a63, #0b84ff); border-color: rgba(11,132,255,.5); box-shadow: 0 4px 15px rgba(11,132,255,0.3); }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

        .quick-switch { grid-area: servers; position: sticky; top: 16px; height: calc(100vh - 40px); background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; display: flex; flex-direction: column; box-shadow: var(--shadow); overflow: hidden; }
        .switch-head { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
        .switch-title { color: #fff; font-size: 20px; font-weight: 1000; text-transform: uppercase; letter-spacing: 0.5px; }
        .channel-tools { padding: 16px; }
        .search-box input { width: 100%; height: 46px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; padding: 0 16px; font-family: inherit; font-size: 15px; font-weight: 600; transition: border-color 0.3s ease; }
        .search-box input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,132,255,0.1); }
        .channel-strip { flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
        
        /* Advanced Glassmorphism Cards */
        .channel-card { 
            display: grid; grid-template-columns: 46px minmax(0,1fr) auto; align-items: center; gap: 14px; 
            padding: 12px; background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; color: #fff; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-align: left; position: relative; overflow: hidden;
        }
        .channel-card:hover { 
            background: rgba(255,255,255,0.08); border-color: rgba(11,132,255,.4); 
            transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        }
        .channel-card.active { 
            background: linear-gradient(90deg, rgba(11, 132, 255, 0.15), rgba(11, 132, 255, 0.05)); 
            border-color: var(--brand); box-shadow: inset 4px 0 0 var(--brand), 0 8px 25px rgba(11,132,255,0.25); 
            transform: translateX(4px); 
        }
        .channel-logo { width: 48px; height: 42px; border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 3px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .channel-logo img { max-width: 100%; max-height: 100%; border-radius: 4px; object-fit: contain; }
        .channel-name { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.3px; }
        .channel-stat { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #d9edff; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 6px; margin-top: 6px; font-weight: 700; border: 1px solid rgba(255,255,255,0.05); }
        .channel-stat.live { background: rgba(34,197,94,0.15); color: #dfffea; border-color: rgba(34,197,94,0.3); }

        /* Developer Footer */
        .dev-footer {
            grid-area: footer;
            text-align: center;
            padding: 24px 0;
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .dev-footer p {
            margin: 0; color: #9aacbf; font-size: 14px; font-weight: 800; letter-spacing: 0.5px;
        }
        .dev-name {
            color: #fff; font-weight: 900; 
            text-shadow: 0 0 15px rgba(11,132,255,0.6);
            transition: 0.3s;
        }
        .dev-name:hover { text-shadow: 0 0 25px rgba(11,132,255,0.9); }

        @media(max-width: 1100px) {
            .page { grid-template-columns: 280px 1fr; grid-template-areas: 'score score' 'servers player' 'servers info' 'footer footer'; }
        }
        @media(max-width: 900px) {
            .page { display: flex; flex-direction: column; padding: 12px; gap: 12px; }
            .quick-switch { height: 500px; position: static; }
            .player-bar { grid-template-columns: 1fr; }
            .bar-actions { justify-content: space-between; }
            .action-btn { flex: 1; justify-content: center; padding: 0 5px; }
            .mlbd-scoreboard { padding: 14px; gap: 10px; grid-template-columns: 1fr; text-align: center; }
            .score-team { justify-content: center; font-size: 18px; }
            .score-team-right { flex-direction: row-reverse; }
            .score-team img { width: 40px; height: 40px; }
            .score-live { justify-self: center; margin: 0 auto; }
        }

        /* Toast UI */
        .toast { position: fixed; bottom: 20px; right: 20px; background: rgba(8, 19, 33, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px 24px; border-radius: 8px; font-weight: 800; font-size: 14px; z-index: 9999; transform: translateY(100px); opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast i { color: var(--brand); font-size: 16px; }
    </style>
</head>

<div class="page">

    <!-- Topbar Scoreboard -->
    <header class="topbar mlbd-scoreboard">
        <div class="score-team score-team-left">
            <img src="https://flagcdn.com/qa.svg" alt="Qatar">
            <strong>Qatar</strong>
        </div>
        <div class="score-center">
            <div class="score-live"><span></span> LIVE NOW</div>
            <div class="score-title">FIFA World Cup 2026 • Group B</div>
        </div>
        <div class="score-team score-team-right">
            <strong>Switzerland</strong>
            <img src="https://flagcdn.com/ch.svg" alt="Switzerland">
        </div>
    </header>

    <!-- Sidebar Servers -->
    <section class="quick-switch" id="channelSection">
        <div class="switch-head">
            <div class="switch-title">Channels</div>
            <div class="switch-count" id="channel-count" style="font-size: 13px; color: var(--muted); font-weight: 800; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px;">Loading...</div>
        </div>
        <div class="channel-tools">
            <div class="search-box">
                <input type="text" id="channelSearch" placeholder="Search channels..." autocomplete="off">
            </div>
        </div>
        <div class="channel-strip" id="channelStrip">
            <!-- Channels dynamically injected here -->
        </div>
    </section>

    <!-- Main Player -->
    <section class="player-card" id="playerCard">
        <div class="player-wrap" id="videoContainer">
            <!-- Video element intentionally has controls enabled for mobile fallback -->
            <video id="liveVideo" controls playsinline></video>
        </div>
        <div class="player-bar">
            <div class="now-playing-switch">
                <div class="bar-channel-picker-btn">
                    <span class="bar-channel-logo flex items-center justify-center bg-white rounded h-8 w-10 overflow-hidden" id="active-logo"><i class="fa fa-tv text-slate-800"></i></span>
                    <span class="channel-name flex-1 truncate" id="active-name">Select a Channel</span>
                </div>
            </div>
            <div class="bar-actions">
                <button type="button" class="action-btn primary" id="playBtn" onclick="togglePlay()"><i class="fa fa-play"></i> Play</button>
                <button type="button" class="action-btn" id="muteBtn" onclick="toggleMute()"><i class="fa fa-volume-up"></i> Sound</button>
                <button type="button" class="action-btn" id="fullscreenBtn" onclick="toggleFullscreen()"><i class="fa fa-expand"></i> Fullscreen</button>
            </div>
        </div>
    </section>

    <!-- Developer Footer Credit -->
    <footer class="dev-footer">
        <p>
            <i class="fa fa-code" style="color: var(--brand); margin-right: 6px;"></i> 
            Developed by <span class="dev-name">Md Sabbir</span>
        </p>
    </footer>

</div>

<div class="toast" id="toastBox"><i class="fa fa-info-circle"></i> <span id="toastText">Notification</span></div>

    let currentActiveId = null;
    let hlsInstance = null;
    let dashInstance = null;
    const video = document.getElementById('liveVideo');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');

    function renderChannels(filterText = '') {
        const strip = document.getElementById('channelStrip');
        strip.innerHTML = '';
        
        let visibleCount = 0;
        window.masterChannels.forEach((ch, index) => {
            if (filterText && !ch.title.toLowerCase().includes(filterText.toLowerCase())) return;
            
            const isActive = ch.id === currentActiveId;
            const card = document.createElement('button');
            card.className = `channel-card ${isActive ? 'active' : ''}`;
            card.onclick = () => playStream(ch);
            
            card.innerHTML = `
                <div class="channel-logo"><img src="${ch.logo}" onerror="this.style.display='none'"></div>
                <div>
                    <div class="channel-name">${ch.title}</div>
                    <div class="channel-stat live"><i class="fa fa-circle"></i> ${(Math.random() * 50 + 1).toFixed(1)}K</div>
                </div>
            `;
            strip.appendChild(card);
            visibleCount++;
        });
        
        document.getElementById('channel-count').textContent = `${visibleCount} Channels`;
    }

    document.getElementById('channelSearch').addEventListener('input', (e) => {
        renderChannels(e.target.value);
    });

    function playStream(channel) {
        currentActiveId = channel.id;
        renderChannels(document.getElementById('channelSearch').value);
        
        // Update Player Bar
        document.getElementById('active-logo').innerHTML = `<img src="${channel.logo}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'">`;
        document.getElementById('active-name').textContent = channel.title;

        // SAFE TEARDOWN: Destroy engines
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        if (dashInstance) { dashInstance.reset(); dashInstance = null; }
        
        // SAFE RESET: Purge old source to prevent NotSupportedError
        video.pause();
        video.removeAttribute('src');
        video.load();

        const isDash = channel.type === 'dash' || channel.url.includes('.dash') || channel.url.includes('.mpd');
        const isHls = channel.type === 'hls' || channel.url.includes('.m3u8');

        try {
            if (isDash && typeof dashjs !== 'undefined') {
                dashInstance = dashjs.MediaPlayer().create();
                dashInstance.initialize(video, channel.url, true);
                
                dashInstance.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                    console.warn("DASH Engine Warning:", e);
                });
                
            } 
            else if (isHls && Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { 
                    const playPromise = video.play();
                    // Catch Unhandled Rejection to prevent console crash
                    if (playPromise !== undefined) {
                        playPromise.catch(e => {
                            console.warn("Autoplay block (HLS). Setting muted:", e);
                            video.muted = true;
                            video.play().catch(err => console.log("Final play block:", err));
                        });
                    }
                });
                
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            hlsInstance.startLoad();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                        } else {
                            hlsInstance.destroy();
                            showToast("Fatal stream error. Please select another channel.");
                        }
                    }
                });
            } 
            else {
                // Fallback for Native HLS (Safari/iOS) or Direct MP4 files
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(e => {
                            console.warn("Autoplay block (Native). Setting muted:", e);
                            video.muted = true;
                            video.play().catch(err => console.log("Final play block:", err));
                        });
                    }
                }, { once: true });
                
                video.addEventListener('error', (e) => {
                    console.warn("Native Video Error:", video.error);
                }, { once: true });
            }
        } catch (err) {
            console.error("Playback pipeline error:", err);
            showToast("Video format error.");
        }

        updateMediaUI();
    }

    function togglePlay() {
        if (video.paused) { 
            video.play().catch(e => console.warn(e)); 
        } else { 
            video.pause(); 
        }
        updateMediaUI();
    }

    function toggleMute() {
        video.muted = !video.muted;
        updateMediaUI();
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.getElementById('playerCard').requestFullscreen().catch(err => {});
        } else {
            document.exitFullscreen();
        }
    }

    function updateMediaUI() {
        playBtn.innerHTML = video.paused ? '<i class="fa fa-play"></i> Play' : '<i class="fa fa-pause"></i> Pause';
        muteBtn.innerHTML = video.muted ? '<i class="fa fa-volume-mute"></i> Unmute' : '<i class="fa fa-volume-up"></i> Sound';
    }

    video.addEventListener('play', updateMediaUI);
    video.addEventListener('pause', updateMediaUI);
    video.addEventListener('volumechange', updateMediaUI);

    function showToast(msg) {
        const box = document.getElementById('toastBox');
        document.getElementById('toastText').textContent = msg;
        box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderChannels();
        if(window.masterChannels.length > 0) {
            // Auto-play the first channel safely
            playStream(window.masterChannels[0]); 
        }
    });

</script>
