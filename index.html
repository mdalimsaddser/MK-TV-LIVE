<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>LiveKhela - Pro ATV Streaming Platform</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-body: #030712;
            --bg-sidebar: #0b1329;
            --bg-header: #070b19;
            --bg-panel: #111c40;
            --bg-chat: #0a1024;
            --bg-input: #1a233a;
            
            --border: rgba(255,255,255,0.08);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            
            --brand: #0b84ff; 
            --brand-hover: #40a0ff;
            --danger: #ef4444;
            --success: #10b981;
            --admin: #f59e0b;
            
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            --header-height: 64px;
            --font-family: 'Inter', sans-serif;
        }
        
        * { box-sizing: border-box; outline: none; transition: all 0.2s ease-in-out; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); font-family: var(--font-family); -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* --- Top Navigation Bar --- */
        .top-navbar { height: var(--header-height); background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 50; }
        .nav-left { display: flex; align-items: center; gap: 24px; }
        .brand-logo { font-weight: 900; font-size: 22px; color: #fff; text-transform: uppercase; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;}
        .brand-logo span { color: var(--brand); }
        .atv-badge { background: linear-gradient(135deg, #0b84ff, #0052cc); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; vertical-align: middle;}
        
        .nav-center { flex: 1; max-width: 600px; padding: 0 24px; }
        .search-wrapper { position: relative; width: 100%; }
        .search-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-input { width: 100%; height: 40px; background: var(--bg-input); border: 1px solid transparent; border-radius: 20px; color: #fff; padding: 0 20px 0 46px; font-size: 14px; }
        .search-input:focus { border-color: var(--brand); background: #111827; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-icon-btn { background: transparent; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; position: relative; }
        .nav-icon-btn:hover { color: #fff; }
        .nav-icon-btn .badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg-header); }
        
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; background: rgba(255,255,255,0.05); padding: 4px 12px 4px 4px; border-radius: 20px; border: 1px solid var(--border); }
        .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--brand); }
        .user-profile .role { font-size: 12px; font-weight: 800; color: var(--admin); text-transform: uppercase;}

        /* --- Main Workspace --- */
        .workspace { display: flex; flex: 1; height: calc(100vh - var(--header-height)); overflow: hidden; }

        /* --- Left Sidebar (Channels) --- */
        .sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; transition: transform 0.3s ease; flex-shrink: 0;}
        .channel-list-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 12px 4px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
        .list-title { color: var(--text-muted); text-transform: uppercase; font-weight: 700; font-size: 11px; letter-spacing: 1px; }
        .channel-count { font-size: 11px; color: #fff; font-weight: 700; background: #1f2937; padding: 2px 8px; border-radius: 12px; }

        .channel-card { display: flex; align-items: center; gap: 12px; padding: 10px; background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); text-align: left; width: 100%; cursor: pointer;}
        .channel-card:hover { background: rgba(255,255,255,0.05); }
        .channel-card.active { background: rgba(11,132,255,0.1); border-color: rgba(11,132,255,0.3); }
        .ch-logo-wrapper { width: 40px; height: 40px; background: #1f2937; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 4px; overflow: hidden; flex-shrink: 0;}
        .ch-logo-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .ch-info { flex: 1; min-width: 0; }
        .ch-name { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-status { font-size: 11px; color: var(--text-muted); margin-top: 2px;}
        .ch-status.live { color: var(--danger); font-weight: 600;}
        .ch-status.live i { font-size: 6px; vertical-align: middle; margin-right: 3px; animation: blink 1s infinite alternate; }

        /* --- Center Content (Video Player & Info) --- */
        .center-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-body); overflow-y: auto; position: relative; }
        .player-wrapper { width: 100%; background: #000; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .video-container { width: 100%; max-width: 100%; margin: 0 auto; aspect-ratio: 16/9; position: relative; background: #000; overflow: hidden;}
        #liveVideo { width: 100%; height: 100%; object-fit: contain; outline: none; }
        
        .loader-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 5; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .loader-overlay.active { opacity: 1; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--brand); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }

        /* --- Custom Video Player Overlay UI with Live Time --- */
        .video-container:hover .player-overlay-controls { opacity: 1; }
        .player-overlay-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 20px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity 0.3s ease; z-index: 10; }
        
        .progress-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-bar-container:hover { height: 6px; }
        .progress-fill { height: 100%; background: var(--danger); width: 100%; border-radius: 2px; position: relative; box-shadow: 0 0 10px var(--danger); }
        .progress-fill::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: #fff; border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
        .progress-bar-container:hover .progress-fill::after { opacity: 1; }

        .overlay-controls-row { display: flex; justify-content: space-between; align-items: center; }
        .overlay-left, .overlay-right { display: flex; align-items: center; gap: 15px; }
        
        .overlay-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; opacity: 0.8; transition: opacity 0.2s, transform 0.1s; }
        .overlay-btn:hover { opacity: 1; transform: scale(1.1); }
        
        .time-display { font-size: 13px; font-weight: 500; color: #fff; display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);}
        .live-badge { background: var(--danger); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase;}
        .clock-display { color: var(--brand); font-family: monospace; font-weight: 800; font-size: 14px; letter-spacing: 1px;}
        .quality-badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); }

        /* Channel Meta Details below video */
        .channel-details-section { max-width: 1400px; margin: 0 auto; padding: 24px; width: 100%; }
        .stream-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; color: #fff; }
        .meta-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; }
        .meta-left { display: flex; align-items: center; gap: 16px; }
        .meta-logo { width: 56px; height: 56px; border-radius: 50%; background: #1f2937; padding: 4px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid var(--border);}
        .meta-logo img { max-width: 100%; border-radius: 50%; }
        .meta-info h2 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .meta-info p { font-size: 13px; color: var(--text-muted); }
        
        .subscribe-btn { background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; margin-left: 12px;}
        .subscribe-btn:hover { background: #e5e7eb; }

        .meta-right { display: flex; gap: 12px; }
        .action-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;}
        .action-btn:hover { background: rgba(255,255,255,0.15); }
        .action-btn i { font-size: 16px; }

        /* --- Right Sidebar (Live Chat - Advanced) --- */
        .chat-panel { width: 340px; background: var(--bg-chat); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; transition: transform 0.3s ease; flex-shrink: 0;}
        .chat-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-header); }
        .chat-header h3 { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px;}
        .chat-header .live-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: blink 1s infinite alternate;}
        
        .admin-controls { background: rgba(245, 158, 11, 0.1); padding: 8px 16px; border-bottom: 1px solid rgba(245, 158, 11, 0.2); display: flex; justify-content: space-between; align-items: center;}
        .admin-controls span { color: var(--admin); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .clear-chat-btn { background: var(--danger); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer;}
        .clear-chat-btn:hover { background: #dc2626; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; scroll-behavior: smooth;}
        .chat-msg { line-height: 1.4; word-wrap: break-word; background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 8px; border: 1px solid transparent;}
        .chat-msg.admin-msg { border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05); }
        
        .chat-msg .badge.admin { background: var(--admin); color: #000; font-size: 9px; padding: 2px 5px; border-radius: 4px; margin-right: 6px; font-weight: 800;}
        .chat-msg .badge.user { background: var(--brand); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 4px; margin-right: 6px; font-weight: 800;}
        
        .chat-msg .user-name { font-weight: 700; color: #9ca3af; margin-right: 6px; }
        .chat-msg.admin-msg .user-name { color: var(--admin); }
        .chat-msg .text { color: #f9fafb; }
        .chat-msg .time-stamp { float: right; font-size: 10px; color: #6b7280; margin-left: 10px;}
        
        .chat-input-area { padding: 16px; border-top: 1px solid var(--border); background: var(--bg-header); }
        .chat-input-wrapper { display: flex; background: var(--bg-input); border-radius: var(--radius-sm); border: 1px solid transparent; overflow: hidden;}
        .chat-input-wrapper:focus-within { border-color: var(--brand); }
        .chat-input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px; font-size: 13px; }
        .chat-input-wrapper button { background: transparent; border: none; color: var(--brand); padding: 0 16px; cursor: pointer; font-weight: 700;}
        .chat-input-wrapper button:hover { color: var(--brand-hover); }

        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: rgba(17, 24, 39, 0.95); color: #fff; padding: 12px 24px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; animation: slideUp 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; backdrop-filter: blur(10px);}
        .toast i { color: var(--brand); font-size: 16px; }

        body.cinema-mode .top-navbar,
        body.cinema-mode .sidebar,
        body.cinema-mode .chat-panel,
        body.cinema-mode .channel-details-section { display: none !important; }
        body.cinema-mode .workspace { height: 100vh; }
        body.cinema-mode .center-content { background: #000; justify-content: center; }
        body.cinema-mode .video-container { max-width: 100vw; height: 100vh; }
        
        body.theater-mode .sidebar { display: none; }
        body.theater-mode .center-content { background: #000; }
        body.theater-mode .video-container { max-width: 100%; height: calc(100vh - var(--header-height) - 140px); }

        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

        @media (max-width: 1200px) {
            .chat-panel { position: absolute; right: 0; top: 0; height: 100%; transform: translateX(100%); }
            .chat-panel.active { transform: translateX(0); box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        }
        @media (max-width: 900px) {
            .sidebar { position: absolute; left: 0; top: 0; height: 100%; transform: translateX(-100%); z-index: 40; }
            .sidebar.active { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .nav-center { display: none; }
            .meta-row { flex-direction: column; }
            .meta-right { width: 100%; justify-content: space-between; flex-wrap: wrap; }
            .action-btn { flex: 1; justify-content: center; }
            body.theater-mode .video-container { height: auto; aspect-ratio: 16/9; }
        }
    </style>
</head>
<body>

<header class="top-navbar">
    <div class="nav-left">
        <button class="nav-icon-btn" id="mobileMenuBtn" style="display: none;"><i class="fa fa-bars"></i></button>

    <!-- Center Workspace: Player & Details -->

                <div class="player-overlay-controls">
                    <div class="progress-bar-container" id="progressBarContainer">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="overlay-controls-row">
                        <div class="overlay-left">
                            <button class="overlay-btn" onclick="togglePlay()" title="Play/Pause (Space)"><i class="fa fa-play" id="overlayPlayIcon"></i></button>
                            <button class="overlay-btn" onclick="toggleMute()" title="Mute/Unmute (M)"><i class="fa fa-volume-up" id="overlayMuteIcon"></i></button>
                            
                            <!-- ADVANCED TIME DISPLAY ON VIDEO -->
                            <div class="time-display">
                                <span class="live-badge"><i class="fa fa-circle" style="font-size: 6px; vertical-align: middle; margin-right: 3px;"></i> LIVE</span>
                                <span class="clock-display" id="system-clock">00:00:00</span>
                                <span style="color: rgba(255,255,255,0.4);">|</span>

                            </div>
                        </div>
                        <div class="overlay-right">

                            <button class="overlay-btn" onclick="toggleCinemaMode()" title="Cinema Mode (C)"><i class="fa fa-moon"></i></button>
                            <button class="overlay-btn" onclick="toggleFullscreen()" title="Fullscreen (F)"><i class="fa fa-expand"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Channel Meta Details -->
        <div class="channel-details-section">
            <h1 class="stream-title" id="meta-title">Please Select a Channel to Watch</h1>
            <div class="meta-row">
                <div class="meta-left">
                    <div class="meta-logo" id="meta-logo"><i class="fa fa-tv text-muted fa-2x"></i></div>
                    <div class="meta-info">
                        <h2 id="meta-channel-name">LiveKhela ATV</h2>
                        <p>
                            <span style="color: var(--danger); font-weight: 600;"><i class="fa fa-circle" style="font-size: 8px;"></i> LIVE</span> • 
                            <span id="meta-viewers">12.4K</span> watching now
                        </p>
                    </div>
                    <button class="subscribe-btn">Subscribe</button>
                </div>
                <div class="meta-right">
                    <button class="action-btn" onclick="showToast('Liked!')"><i class="fa fa-thumbs-up"></i> 4.2K</button>
                    <button class="action-btn" onclick="showToast('Share link copied!')"><i class="fa fa-share"></i> Share</button>
                    <button class="action-btn"><i class="fa fa-ellipsis-h"></i></button>
                </div>
            </div>
        </div>
    </main>

    <!-- Right Sidebar: Live Chat -->
    <aside class="chat-panel" id="chatPanelUI">

            <h3><div class="live-dot"></div> Real-Time Chat</h3>

        </div>

            <div class="chat-msg" style="text-align: center; color: var(--text-muted); font-size: 11px; margin-bottom: 10px;">Connecting to Real-time Global Chat...</div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" placeholder="Admin Message..." id="chatInput" onkeypress="handleChatEnter(event)">
                <button onclick="sendUserMessage()">Send</button>
            </div>
        </div>
    </aside>
</div>

<div class="toast-container" id="toastContainer"></div>

    const defaultWcChannels = {
        "atv_source_1": { id: "atv_source_1", title: "Global News Live", desc: "24/7 International News Broadcast.", type: "hls", url: "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8", logo: "https://ui-avatars.com/api/?name=News&background=ef4444&color=fff&bold=true" },
        "atv_source_2": { id: "atv_source_2", title: "NASA Space & Tech", desc: "Live coverage from outer space and tech.", type: "hls", url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8", logo: "https://ui-avatars.com/api/?name=NASA&background=0b1329&color=0b84ff&bold=true" },
        "atv_source_3": { id: "atv_source_3", title: "LiveKhela Movies", desc: "Streaming classic animated movies 24/7.", type: "hls", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "https://ui-avatars.com/api/?name=Movies&background=10b981&color=fff&bold=true" }
    };

    function syncLiveDatabase() {
        database.ref('channels').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) { database.ref('channels').set(defaultWcChannels); return; }
            window.masterChannels = [];
            for (let key in data) { if(data[key]) window.masterChannels.push(data[key]); }
            renderChannels();
            if (window.masterChannels.length > 0 && !currentActiveId) { playStream(window.masterChannels[0]); }
        });
    }

    function renderChannels(filterText = '') {
        const strip = document.getElementById('channelStrip');
        strip.innerHTML = '';
        let visibleCount = 0;

        window.masterChannels.forEach((ch) => {
            if (filterText && !ch.title.toLowerCase().includes(filterText.toLowerCase())) return;
            const isActive = ch.id === currentActiveId;
            const card = document.createElement('div');
            card.className = `channel-card ${isActive ? 'active' : ''}`;
            card.onclick = () => playStream(ch);
            
            const logo = ch.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(ch.title.charAt(0))}&background=1f2937&color=fff&bold=true`;
            card.innerHTML = `
                <div class="ch-logo-wrapper"><img src="${logo}" onerror="this.src='https://ui-avatars.com/api/?name=TV&background=1f2937&color=fff'"></div>
                <div class="ch-info">
                    <div class="ch-name">${ch.title}</div>
                    <div class="ch-status live"><i class="fa fa-circle"></i> Live</div>
                </div>
            `;
            strip.appendChild(card);
            visibleCount++;
        });
        document.getElementById('channel-count').textContent = visibleCount;
    }

    document.getElementById('channelSearch').addEventListener('input', (e) => renderChannels(e.target.value));

    let uptimeInterval;
    let streamStartTime = Date.now();

    function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateClocks() {
        // System Time Clock
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit', second: '2-digit' });
        document.getElementById('system-clock').textContent = timeString;

        // Stream Uptime
        const diffInSeconds = Math.floor((Date.now() - streamStartTime) / 1000);
        document.getElementById('stream-uptime').textContent = formatTime(diffInSeconds);
    }
    
    // Start System Clock Loop immediately
    setInterval(updateClocks, 1000);

    const chatBox = document.getElementById('chatBox');
    const chatRef = database.ref('live_global_chat'); // Using a specific global path
    let isChatInitialized = false;

    function initRealChat() {
        if(isChatInitialized) return;
        isChatInitialized = true;
        chatBox.innerHTML = ''; // Clear connecting text
        
        // Load last 50 messages real-time
        chatRef.limitToLast(50).on('child_added', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                renderChatMessage(data.name, data.text, data.role, data.timestamp);
            }
        });

        // Listen for chat clear event
        chatRef.on('child_removed', () => {
            chatBox.innerHTML = '<div class="chat-msg" style="text-align: center; color: var(--text-muted); font-size: 11px; margin-bottom: 10px;">Chat cleared by Admin</div>';
        });
    }

    function renderChatMessage(name, text, role, timestamp) {
        const msg = document.createElement('div');
        msg.className = `chat-msg ${role === 'admin' ? 'admin-msg' : ''}`;
        
        const timeFormatted = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        let badgeHtml = '';
        if(role === 'admin') badgeHtml = '<span class="badge admin"><i class="fa fa-shield-alt"></i> ADMIN</span>';
        else badgeHtml = '<span class="badge user">USER</span>';

        msg.innerHTML = `
            <span class="time-stamp">${timeFormatted}</span>
            ${badgeHtml}
            <span class="user-name">${name}:</span>
            <span class="text">${text}</span>
        `;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendUserMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(text !== "") {
            // Push to Real Firebase DB
            chatRef.push({
                name: "Md Sabbir", // Current User/Admin Name
                role: "admin",     // Giving you admin powers
                text: text,
                timestamp: Date.now()
            });
            input.value = "";
        }
    }
    function handleChatEnter(e) { if(e.key === 'Enter') sendUserMessage(); }

    function adminClearChat() {
        if(confirm("Are you sure you want to clear the global live chat?")) {
            chatRef.remove().then(() => {
                showToast("<i class='fa fa-trash'></i> Chat History Cleared");
                chatBox.innerHTML = '';
            }).catch(e => {
                showToast("Failed to clear. Permission denied?");
                console.error(e);
            });
        }
    }

    function playStream(channel) {
        if (currentActiveId === channel.id && !video.paused) return;
        currentActiveId = channel.id;
        renderChannels(document.getElementById('channelSearch').value);
        
        // Reset uptime for new channel
        streamStartTime = Date.now() - Math.floor(Math.random() * 7200000); 
        updateClocks();

        // Update Meta Details
        const logo = channel.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(channel.title.charAt(0))}&background=1f2937&color=fff`;
        document.getElementById('meta-logo').innerHTML = `<img src="${logo}">`;
        document.getElementById('meta-channel-name').textContent = channel.title;
        document.getElementById('meta-title').textContent = channel.desc || `${channel.title} - Official Live Broadcast`;
        document.getElementById('meta-viewers').textContent = (Math.random() * 20 + 5).toFixed(1) + "K";

        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        if (dashInstance) { dashInstance.reset(); dashInstance = null; }
        
        video.pause(); video.removeAttribute('src'); video.load();
        loader.classList.add('active'); 
        showToast(`<i class="fa fa-satellite-dish"></i> Tuned to ${channel.title}`);

        if (channel.type === 'hls' || channel.url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=> video.muted=true));
            } else { video.src = channel.url; }
        } else {
            dashInstance = dashjs.MediaPlayer().create();
            dashInstance.initialize(video, channel.url, true);
        }
        updateMediaUI();
    }

    // --- Custom Controls & Modes ---
    function togglePlay() { 
        if (video.paused) video.play().catch(()=>{}); 
        else video.pause(); 
        updateMediaUI(); 
    }
    function toggleMute() { video.muted = !video.muted; updateMediaUI(); }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) document.getElementById('playerCard').requestFullscreen().catch(()=>video.webkitEnterFullscreen?.());
        else document.exitFullscreen();
    }
    
    async function togglePiP() {
        try { document.pictureInPictureElement ? await document.exitPictureInPicture() : await video.requestPictureInPicture(); } 
        catch (e) { showToast("PiP not supported in this browser."); }
    }
    
    function toggleTheaterMode() {
        document.body.classList.toggle('theater-mode');
        document.body.classList.remove('cinema-mode'); 
        showToast(document.body.classList.contains('theater-mode') ? "Theater Mode Enabled" : "Theater Mode Disabled");
        window.dispatchEvent(new Event('resize'));
    }

    function toggleCinemaMode() {
        document.body.classList.toggle('cinema-mode');
        document.body.classList.remove('theater-mode'); 
        showToast(document.body.classList.contains('cinema-mode') ? "Cinema Mode Enabled" : "Cinema Mode Disabled");
    }
    
    function toggleChat() { 
        document.getElementById('chatPanelUI').classList.toggle('active'); 
    }

    function updateMediaUI() {
        const isPaused = video.paused;
        const isMuted = video.muted;
        document.getElementById('overlayPlayIcon').className = isPaused ? 'fa fa-play' : 'fa fa-pause';
        document.getElementById('overlayMuteIcon').className = isMuted ? 'fa fa-volume-mute' : 'fa fa-volume-up';
    }

    video.addEventListener('play', updateMediaUI);
    video.addEventListener('pause', updateMediaUI);
    video.addEventListener('waiting', () => loader.classList.add('active'));
    video.addEventListener('playing', () => loader.classList.remove('active'));

    function showToast(message) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = message;
        container.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'fadeOut 0.3s forwards'; setTimeout(() => toast.remove(), 300); }, 2500);
    }

    // Keyboard Bindings
    document.addEventListener('keydown', (e) => {
        if (['chatInput', 'channelSearch'].includes(document.activeElement.id)) return;
        switch(e.key.toLowerCase()) {
            case ' ': e.preventDefault(); togglePlay(); break;
            case 'm': e.preventDefault(); toggleMute(); break;
            case 'f': e.preventDefault(); toggleFullscreen(); break;
            case 'c': e.preventDefault(); toggleCinemaMode(); break;
            case 't': e.preventDefault(); toggleTheaterMode(); break;
        }
    });

    // Mobile Menu Toggle
    if(window.innerWidth <= 900) { document.getElementById('mobileMenuBtn').style.display = 'block'; }
    document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
        document.getElementById('sidebarUI').classList.toggle('active');
    });

    document.addEventListener('DOMContentLoaded', () => {
        syncLiveDatabase();
        initRealChat(); // Initialize the real Firebase Chat
    });
</script>
</body>
</html>
