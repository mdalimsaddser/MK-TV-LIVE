<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR TV - VIP Live TV Deck (Advanced + Fast Load)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent-glow: #ff0055;
            --accent-neon: #8b00ff;
            --bg-dark: #050508;
            --panel-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f5f5fa;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .dashboard-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ambient Blur Background */
        .bg-blur-ambient {
            position: absolute;
            inset: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(50px) brightness(0.35);
            opacity: 0.55;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Content Layout */
        .content-area {
            display: flex;
            flex: 1;
            z-index: 2;
            width: 100%;
            height: calc(100vh - 40px);
        }

        /* Video Section */
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        /* 16:9 Player Container */
        .player-container {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.85);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            outline: none;
            background: transparent;
        }

        /* Advanced Controls Bar */
        .advanced-controls {
            height: 60px;
            background: rgba(5, 5, 8, 0.9);
            border-top: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-action, select {
            background: var(--panel-glass);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-action:hover, select:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-neon);
        }

        select option {
            background: var(--bg-dark);
            color: white;
        }

        .top-overlay-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-glass);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Channel List Sidebar */
        .sidebar {
            width: 350px;
            background: rgba(10, 10, 15, 0.8);
            border-left: 1px solid var(--border-glass);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            z-index: 3;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-glow);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box {
            width: 100%;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 10px 15px 10px 35px;
            border-radius: 5px;
            outline: none;
            transition: border 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-glow);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .channel-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-item:hover, .channel-item.active {
            background: var(--panel-glass);
            border-left: 4px solid var(--accent-glow);
        }

        /* Notice Bar */
        .notice-bar {
            height: 40px;
            background: var(--accent-neon);
            color: #fff;
            display: flex;
            align-items: center;
            font-weight: 600;
            z-index: 5;
            box-shadow: 0 -5px 20px rgba(139, 0, 255, 0.4);
        }

        marquee {
            width: 100%;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Loading Spinner */
        #loader {
            position: absolute;
            color: white;
            font-size: 2rem;
            z-index: 100;
            display: none;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-glow); }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <div class="bg-blur-ambient" id="bg-blur"></div>
        
        <div class="content-area">
            
            <div class="video-section">
                <div class="player-container">
                    <div class="top-overlay-layer">SR TV VIP</div>
                    <i id="loader" class="fa-solid fa-circle-notch fa-spin"></i>
                    <video id="video-player" controls autoplay></video>
                </div>
                
                <div class="advanced-controls">
                    <div class="control-group">
                        <span id="current-channel-name" style="font-weight: bold; color: var(--accent-glow);">No Channel Selected</span>
                    </div>
                    <div class="control-group">
                        <select id="quality-selector" onchange="changeQuality(this.value)">
                            <option value="-1">Auto Quality</option>
                        </select>
                        <button class="btn-action" onclick="togglePiP()" title="Picture in Picture">
                            <i class="fa-solid fa-clone"></i> PiP Mode
                        </button>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-header">
                    <div><i class="fa-solid fa-tv"></i> Live Channels (<span id="channel-count">0</span>)</div>
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search channels..." onkeyup="filterChannels()">
                    </div>
                </div>
                <ul class="channel-list" id="channel-list">
                    <li class="channel-item" style="justify-content: center; opacity: 0.5;">Loading Playlists...</li>
                </ul>
            </div>
        </div>

        <div class="notice-bar">
            <marquee>Welcome to SR TV VIP Deck. Advanced Features Enabled: Search, HLS Quality Selection, Picture-in-Picture, and Accelerated Proxy Loading.</marquee>
        </div>
    </div>

    <script>
        // CORS proxy to bypass GitHub blocks and load files securely
        const CORS_PROXY = "https://api.allorigins.win/raw?url=";
        
        const PLAYLISTS = [
            CORS_PROXY + "https://raw.githubusercontent.com/bdtechexpert/live-tv-playlist/refs/heads/main/live-tv-playlist.m3u",
            CORS_PROXY + "https://raw.githubusercontent.com/abusaeeidx/Mrgify-Tv/refs/heads/main/playlist.m3u",
            CORS_PROXY + "https://raw.githubusercontent.com/abusaeeidx/Ayna-BDIX-IPTV-Playlist/refs/heads/main/ayna-playlist.m3u",    
            CORS_PROXY + "https://raw.githubusercontent.com/abusaeeidx/T-Sports-Playlist-Auto-Update/refs/heads/main/combine_playlist.m3u",
            CORS_PROXY + "https://raw.githubusercontent.com/v5on/filoox-bdix-selected/refs/heads/main/playlist.m3u"
        ];

        let allChannels = [];
        const video = document.getElementById('video-player');
        const channelListEl = document.getElementById('channel-list');
        const loader = document.getElementById('loader');
        const qualitySelector = document.getElementById('quality-selector');
        let hls = null;

        // Fast Concurrent Initialization
        async function init() {
            const fetchPromises = PLAYLISTS.map(url => 
                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error("Offline or blocked");
                        return response.text();
                    })
                    .then(text => parseM3U(text))
                    .catch(error => {
                        console.warn(`Skipping playlist (CORS/Offline): ${url}`);
                    })
            );

            // Wait for all downloads to finish simultaneously
            await Promise.all(fetchPromises);

            document.getElementById('channel-count').innerText = allChannels.length;
            renderChannels();
        }

        // Basic M3U Parser
        function parseM3U(data) {
            if (!data) return;
            const lines = data.split('\n');
            let currentChannel = { name: 'Unknown', url: '' };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    currentChannel.name = parts[parts.length - 1] || 'Unknown Channel';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if(currentChannel.url.startsWith('http')) {
                        allChannels.push({ ...currentChannel });
                    }
                    currentChannel = { name: 'Unknown', url: '' }; 
                }
            }
        }

        // Render Sidebar
        function renderChannels() {
            channelListEl.innerHTML = '';
            
            if (allChannels.length === 0) {
                channelListEl.innerHTML = '<li class="channel-item" style="justify-content: center; color: red;">No channels loaded. Check server connection.</li>';
                return;
            }

            const displayLimit = Math.min(allChannels.length, 1000); 

            for (let i = 0; i < displayLimit; i++) {
                const channel = allChannels[i];
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.setAttribute('data-name', channel.name.toLowerCase());
                li.innerHTML = `<i class="fa-solid fa-play" style="font-size: 0.8rem; opacity: 0.5;"></i> <span>${channel.name}</span>`;
                
                li.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    document.getElementById('current-channel-name').innerText = channel.name;
                    playStream(channel.url);
                };

                channelListEl.appendChild(li);
            }
        }

        // Search Filter Logic
        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.channel-item');
            
            items.forEach(item => {
                const name = item.getAttribute('data-name');
                if (name && name.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // HLS.js Player Logic with Quality Switcher
        function playStream(url) {
            loader.style.display = 'block';
            qualitySelector.innerHTML = '<option value="-1">Auto Quality</option>'; 

            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls({ maxMaxBufferLength: 30 }); 
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    loader.style.display = 'none';
                    video.play().catch(() => console.log("Autoplay blocked by browser."));
                    
                    const levels = hls.levels;
                    levels.forEach((level, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.text = level.height ? `${level.height}p` : `Resolution ${index + 1}`;
                        qualitySelector.appendChild(option);
                    });
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        loader.style.display = 'none';
                        console.error("Stream Error:", data);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    loader.style.display = 'none';
                    video.play();
                });
            }
        }

        // Quality Change Handler
        function changeQuality(levelIndex) {
            if (hls) {
                hls.currentLevel = parseInt(levelIndex);
            }
        }

        // Picture-in-Picture Logic
        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled && video !== document.pictureInPictureElement) {
                    await video.requestPictureInPicture();
                }
            } catch (error) {
                console.error("PiP failed:", error);
                alert("Picture-in-Picture is not supported or was blocked by your browser.");
            }
        }

        init();
    </script>
</body>
</html>
