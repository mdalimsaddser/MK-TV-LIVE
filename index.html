<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>LiveKhela Clone - Sports & Live TV</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #050b14;
            --panel: #081321;
            --panel2: #0b1728;
            --panel3: #10223b;
            --line: rgba(148,163,184,.12);
            --text: #edf6ff;
            --muted: #9aacbf;
            --brand: #0b84ff;
            --success: #22c55e;
            --danger: #ef4444;
            --radius: 6px;
            --shadow: 0 18px 48px rgba(0,0,0,.34);
        }
        
        * { box-sizing: border-box; }
        html { background: var(--bg); scroll-behavior: smooth; }
        body { margin: 0; min-height: 100vh; background: #050b14; color: var(--text); font-family: 'Nunito', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        body:before { content: ''; position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 12% -10%,rgba(11,132,255,.12),transparent 30%),linear-gradient(180deg,#07111f 0%,#050b14 100%); }
        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; cursor: pointer; outline: none; border: none; }

        .page { width: 100%; max-width: 1560px; margin: 0 auto; padding: 14px 22px 34px; display: grid; grid-template-columns: minmax(260px,320px) minmax(0,1fr) minmax(260px,320px); grid-template-areas: 'score score score' 'servers player info' 'servers match info' 'servers schedule info' 'footer footer footer'; gap: 10px; align-items: start; }
        
        .mlbd-scoreboard { grid-area: score; margin: 0 -10px; min-height: 86px; border-bottom: 2px solid var(--brand); background: repeating-linear-gradient(45deg,#232428 0,#232428 14px,#1c1d21 14px,#1c1d21 28px); padding: 14px 28px; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 18px; border-radius: var(--radius); }
        .score-team { display: flex; align-items: center; gap: 13px; color: #fff; font-size: 24px; font-weight: 1000; text-transform: uppercase; }
        .score-team-right { justify-content: flex-end; text-align: right; }
        .score-team img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.38); }
        .score-center { text-align: center; color: #fff; }
        .score-live { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 14px; border-radius: 4px; background: var(--danger); font-size: 13px; font-weight: 1000; text-transform: uppercase; }
        .score-live span { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1s infinite alternate; }
        .score-title { margin-top: 7px; color: #b7bac1; font-size: 12px; font-weight: 1000; text-transform: uppercase; }
        
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        .player-card { grid-area: player; width: 100%; min-width: 0; }
        .player-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px 6px 0 0; box-shadow: 0 18px 42px rgba(0,0,0,.50); overflow: hidden; }
        #liveVideo { width: 100%; height: 100%; object-fit: contain; outline: none; }
        .player-bar { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(470px, auto); gap: 10px; align-items: center; padding: 12px; background: #081321; border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; }
        .now-playing-switch { display: flex; align-items: center; gap: 10px; }
        .bar-channel-picker-btn { width: 100%; height: 48px; border-radius: 5px; border: 1px solid rgba(11,132,255,.55); background: #102b4a; color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 1000; text-transform: uppercase; text-align: left; }
        .bar-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .action-btn { height: 46px; padding: 0 15px; border-radius: 5px; border: 1px solid rgba(148,183,226,.16); background: #10223b; color: #fff; font-weight: 1000; display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; font-size: 12px; transition: 0.2s; }
        .action-btn.primary { background: #113a63; border-color: rgba(11,132,255,.35); }
        .action-btn:hover { filter: brightness(1.2); }

        .quick-switch { grid-area: servers; position: sticky; top: 10px; height: calc(100vh - 106px); background: #081321; border: 1px solid #303136; border-radius: 6px; display: flex; flex-direction: column; }
        .switch-head { padding: 16px; border-bottom: 1px solid #303136; display: flex; justify-content: space-between; align-items: center; }
        .switch-title { color: #fff; font-size: 20px; font-weight: 1000; text-transform: uppercase; }
        .channel-tools { padding: 12px; }
        .search-box input { width: 100%; height: 42px; background: #050d19; border: 1px solid #334155; border-radius: 5px; color: #fff; padding: 0 12px; font-family: inherit; }
        .channel-strip { flex: 1; overflow-y: auto; padding: 0 12px 14px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #1d4774 transparent; }
        
        .channel-card { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 10px; background: #0a1628; border: 1px solid rgba(148,163,184,.09); border-radius: 6px; color: #fff; transition: 0.2s; text-align: left; }
        .channel-card:hover, .channel-card.active { background: #0c1d34; border-color: rgba(11,132,255,.75); transform: translateX(2px); }
        .channel-card.active { box-shadow: inset 3px 0 0 var(--brand); }
        .channel-logo { width: 48px; height: 42px; border-radius: 5px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .channel-logo img { max-width: 100%; max-height: 100%; border-radius: 3px; }
        .channel-name { font-size: 14px; font-weight: 1000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-stat { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: #d9edff; background: #09294b; padding: 4px 8px; border-radius: 4px; margin-top: 4px; }
        .channel-stat.live { background: #083326; color: #dfffea; }

        @media(max-width: 1100px) {
            .page { grid-template-columns: 280px 1fr; grid-template-areas: 'score score' 'servers player' 'servers info' 'footer footer'; }
        }
        @media(max-width: 900px) {
            .page { display: flex; flex-direction: column; padding: 8px; gap: 10px; }
            .quick-switch { height: 500px; position: static; }
            .player-bar { grid-template-columns: 1fr; }
            .bar-actions { justify-content: space-between; }
            .action-btn { flex: 1; justify-content: center; padding: 0 5px; }
            .mlbd-scoreboard { padding: 10px; gap: 8px; }
            .score-team { font-size: 14px; }
            .score-team img { width: 30px; height: 30px; }
        }

        /* Toast UI */
        .toast { position: fixed; bottom: 20px; right: 20px; background: #0d121b; border: 1px solid #303136; color: #fff; padding: 12px 20px; border-radius: 6px; font-weight: 800; font-size: 14px; z-index: 9999; transform: translateY(100px); opacity: 0; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="page">

    <!-- Topbar Scoreboard -->
    <header class="topbar mlbd-scoreboard">
        <div class="score-team score-team-left">
            <img src="https://flagcdn.com/qa.svg" alt="Qatar">
            <strong>Qatar</strong>
        </div>
        <div class="score-center">
            <div class="score-live"><span></span> LIVE NOW</div>
            <div class="score-title">FIFA World Cup 2026 • Group B</div>
        </div>
        <div class="score-team score-team-right">
            <strong>Switzerland</strong>
            <img src="https://flagcdn.com/ch.svg" alt="Switzerland">
        </div>
    </header>

    <!-- Sidebar Servers -->
    <section class="quick-switch" id="channelSection">
        <div class="switch-head">
            <div class="switch-title">Channels</div>
            <div class="switch-count" id="channel-count">Loading...</div>
        </div>
        <div class="channel-tools">
            <div class="search-box">
                <input type="text" id="channelSearch" placeholder="Search channels..." autocomplete="off">
            </div>
        </div>
        <div class="channel-strip" id="channelStrip">
            <!-- Channels dynamically injected here -->
        </div>
    </section>

    <!-- Main Player -->
    <section class="player-card" id="playerCard">
        <div class="player-wrap" id="videoContainer">
            <!-- Video element intentionally has controls enabled for mobile fallback -->
            <video id="liveVideo" controls playsinline></video>
        </div>
        <div class="player-bar">
            <div class="now-playing-switch">
                <div class="bar-channel-picker-btn">
                    <span class="bar-channel-logo flex items-center justify-center bg-white rounded h-8 w-10 overflow-hidden" id="active-logo"><i class="fa fa-tv text-slate-800"></i></span>
                    <span class="channel-name flex-1 truncate" id="active-name">Select a Channel</span>
                </div>
            </div>
            <div class="bar-actions">
                <button type="button" class="action-btn primary" id="playBtn" onclick="togglePlay()"><i class="fa fa-play"></i> Play</button>
                <button type="button" class="action-btn" id="muteBtn" onclick="toggleMute()"><i class="fa fa-volume-up"></i> Sound</button>
                <button type="button" class="action-btn" id="fullscreenBtn" onclick="toggleFullscreen()"><i class="fa fa-expand"></i> Fullscreen</button>
            </div>
        </div>
    </section>

</div>

<div class="toast" id="toastBox">Notification</div>

<!-- Required Libraries -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<script>
    // Master Channel Database
    window.masterChannels = [
        { id: 'tyc_sports', title: 'TyC Sports', type: 'hls', url: 'https://amg26268-amg26268c14-freelivesports-emea-10267.playouts.now.amagi.tv/ts-us-e2-n2/playlist/amg26268-sportsstudio-tycsports-freelivesportsemea/cb573b1c6570608f84c83d64cef045826e371fde1d6988693eb5518975d10725dce2b48be65b9e3608dd4087351a654f5d79cb12ce1f7cdaa973ad54516c6531c3c4e664bb981477d5c11f5b6af3264b36ab5c6e89614c278abe545bd37dfd522d27c52522163e84b60cbd010796db55926f5ad3ef823c6c625b5b96435dfba040a3ef9c02178130f4a17f19c37e07be9d47cad302b886c64fcd118324f51dc896ed8dd414849b9062ff56af350b0f75309fd27b97cc09e38bc9386d9943282c663d67080e9c345eb3740131cdf1c2ab60fb53fd9d24956524c978f22daa11faa62e94c59b238ea2a9cb4a0118a9c1496824a19fc0c09b6775d5ee9cd36a1888d8d97636583e515e5be7d02ca85d817ba5ce1084bf2084fb4a1531c3904294a714e28555ec67933fc3cbf89972170033444aaa54ac8f758069fc76acdc1c28580d1ce3ca1b94dd996d1d2f68dfd50be15339acd28787903c6a9c4e2c13a841c94b0969fb316e57ec39b6cf6f3bc7755cc57d16d36c18ac0ebcb425fea29bc20338bed18e02dc67fdba07d7b953fd3472094ce3bc7c1f68437fd9e2634d0378c544f6da85b4245e4ebfa1bf8eaa3419093d055d058f908228d5de8e79675cab3415617903029803a40eec0144133bc719a9c43a59c8217878b3927d31776394c1bd84c7e6c24bbb7ad9acac6a7cdb38d54de5b44056244e35e922322778b371ab64d534d4/133/1920x1080_5162480/index.m3u8', logo: 'https://ui-avatars.com/api/?name=TyC&background=020617&color=fff' },
        { id: 'sports_legends', title: 'Sports Legends', type: 'hls', url: 'https://nomawnoijl.gpcdn.net/akash/sportslegends/chunks.m3u8', logo: 'https://ui-avatars.com/api/?name=SL&background=e50914&color=fff' }
    ];

    let currentActiveId = null;
    let hlsInstance = null;
    let dashInstance = null;
    const video = document.getElementById('liveVideo');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');

    function renderChannels(filterText = '') {
        const strip = document.getElementById('channelStrip');
        strip.innerHTML = '';
        
        let visibleCount = 0;
        window.masterChannels.forEach((ch, index) => {
            if (filterText && !ch.title.toLowerCase().includes(filterText.toLowerCase())) return;
            
            const isActive = ch.id === currentActiveId;
            const card = document.createElement('button');
            card.className = `channel-card ${isActive ? 'active' : ''}`;
            card.onclick = () => playStream(ch);
            
            card.innerHTML = `
                <div class="channel-logo"><img src="${ch.logo}" onerror="this.style.display='none'"></div>
                <div>
                    <div class="channel-name">${ch.title}</div>
                    <div class="channel-stat live"><i class="fa fa-circle"></i> ${(Math.random() * 50 + 1).toFixed(1)}K</div>
                </div>
            `;
            strip.appendChild(card);
            visibleCount++;
        });
        
        document.getElementById('channel-count').textContent = `${visibleCount} Channels`;
    }

    document.getElementById('channelSearch').addEventListener('input', (e) => {
        renderChannels(e.target.value);
    });

    function playStream(channel) {
        currentActiveId = channel.id;
        renderChannels(document.getElementById('channelSearch').value);
        
        // Update Player Bar
        document.getElementById('active-logo').innerHTML = `<img src="${channel.logo}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'">`;
        document.getElementById('active-name').textContent = channel.title;

        // SAFE TEARDOWN: Destroy engines
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        if (dashInstance) { dashInstance.reset(); dashInstance = null; }
        
        // SAFE RESET: Purge old source to prevent NotSupportedError
        video.pause();
        video.removeAttribute('src');
        video.load();

        const isDash = channel.type === 'dash' || channel.url.includes('.dash') || channel.url.includes('.mpd');
        const isHls = channel.type === 'hls' || channel.url.includes('.m3u8');

        try {
            if (isDash && typeof dashjs !== 'undefined') {
                dashInstance = dashjs.MediaPlayer().create();
                dashInstance.initialize(video, channel.url, true);
                
                dashInstance.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                    console.warn("DASH Engine Warning:", e);
                });
                
            } 
            else if (isHls && Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { 
                    const playPromise = video.play();
                    // Catch Unhandled Rejection to prevent console crash
                    if (playPromise !== undefined) {
                        playPromise.catch(e => {
                            console.warn("Autoplay block (HLS). Setting muted:", e);
                            video.muted = true;
                            video.play().catch(err => console.log("Final play block:", err));
                        });
                    }
                });
                
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            hlsInstance.startLoad();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                        } else {
                            hlsInstance.destroy();
                            showToast("Fatal stream error. Please select another channel.");
                        }
                    }
                });
            } 
            else {
                // Fallback for Native HLS (Safari/iOS) or Direct MP4 files
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(e => {
                            console.warn("Autoplay block (Native). Setting muted:", e);
                            video.muted = true;
                            video.play().catch(err => console.log("Final play block:", err));
                        });
                    }
                }, { once: true });
                
                video.addEventListener('error', (e) => {
                    console.warn("Native Video Error:", video.error);
                }, { once: true });
            }
        } catch (err) {
            console.error("Playback pipeline error:", err);
            showToast("Video format error.");
        }

        updateMediaUI();
    }

    function togglePlay() {
        if (video.paused) { 
            video.play().catch(e => console.warn(e)); 
        } else { 
            video.pause(); 
        }
        updateMediaUI();
    }

    function toggleMute() {
        video.muted = !video.muted;
        updateMediaUI();
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.getElementById('playerCard').requestFullscreen().catch(err => {});
        } else {
            document.exitFullscreen();
        }
    }

    function updateMediaUI() {
        playBtn.innerHTML = video.paused ? '<i class="fa fa-play"></i> Play' : '<i class="fa fa-pause"></i> Pause';
        muteBtn.innerHTML = video.muted ? '<i class="fa fa-volume-mute"></i> Unmute' : '<i class="fa fa-volume-up"></i> Sound';
    }

    video.addEventListener('play', updateMediaUI);
    video.addEventListener('pause', updateMediaUI);
    video.addEventListener('volumechange', updateMediaUI);

    function showToast(msg) {
        const box = document.getElementById('toastBox');
        box.textContent = msg;
        box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderChannels();
        if(window.masterChannels.length > 0) {
            // Auto-play the first channel safely
            playStream(window.masterChannels[0]); 
        }
    });

</script>
</body>
</html>
